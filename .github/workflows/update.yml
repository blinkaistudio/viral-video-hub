name: daily-update

on:
  schedule:
    - cron: "30 22 * * *"   # 매일 07:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scrape all sources
        run: python run_all.py
      - name: Commit & push
        run: |
          git config user.name "viral-hub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "auto-update $(date -u +%F)"
          # 썸네일 바이너리 리베이스 충돌 방지: 항상 내(최신 수집) 쪽 우선 머지
          git fetch origin main && git merge -s ours origin/main -m "merge remote" || true
          git push
